name: Main training robustness check

on:
  push:
    branches:
      - ci/main-training-robustness-check

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-timeout
      - name: Run merged robustness tests
        run: pytest tests/test_training_robustness.py -vv
