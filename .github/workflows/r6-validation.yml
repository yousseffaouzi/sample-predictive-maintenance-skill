name: R6 validation

on:
  push:
    branches:
      - ci/r6-validation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Focused leakage tests
        run: uv run pytest tests/test_data_leakage.py -q
      - name: Full repository tests
        run: uv run pytest tests/ -q
