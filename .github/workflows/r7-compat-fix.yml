name: Fix R7 programmatic defaults

on:
  push:
    branches:
      - automation/r7-compat-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/classification-operating-point-selection

      - name: Preserve backward-compatible defaults
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("pdm/fault_prediction/train.py")
          text = p.read_text()
          old = 'optimization_priority = normalize_optimization_priority(args.optimization_priority)'
          new = 'optimization_priority = normalize_optimization_priority(getattr(args, "optimization_priority", "balanced"))'
          if text.count(old) != 1:
              raise SystemExit(f"expected one multi-label priority match, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    eval_metric = (\n        classification_eval_metric(args.optimization_priority)\n        if formulation == "classification"\n        else "root_mean_squared_error"\n    )\n'''
          new = '''    optimization_priority = normalize_optimization_priority(\n        getattr(args, "optimization_priority", "balanced")\n    )\n    eval_metric = (\n        classification_eval_metric(optimization_priority)\n        if formulation == "classification"\n        else "root_mean_squared_error"\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one single-training metric block, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1))
          PY

          git diff --check

      - name: Commit fix
        run: |
          git config user.name "Youssef Faouzi"
          git config user.email "46967695+yousseffaouzi@users.noreply.github.com"
          git add pdm/fault_prediction/train.py
          git commit -m "fix: preserve classification training defaults"
          git push origin HEAD:feat/classification-operating-point-selection
