name: PDM02F sensor plausibility validation
on:
  push:
    branches: [ci/pdm02f-plausibility-validation]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      - run: uv sync --frozen --extra serve
      - name: Sensor plausibility and existing monitoring tests
        run: uv run --frozen --extra serve pytest tests/test_sensor_plausibility.py tests/test_monitoring.py -ra
      - name: Full repository suite
        run: uv run --frozen --extra serve pytest tests/ -ra
      - name: Candidate diff and syntax checks
        run: |
          git diff --check c9b39456a7b87256983a2bf14c20092fe82527fe b775183e946564fc5473fb948d8aa1953af3ac2c
          uv run --frozen --extra serve python -m py_compile pdm/monitoring/plausibility.py tests/test_sensor_plausibility.py
