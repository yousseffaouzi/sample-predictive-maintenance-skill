name: R4 label-economics validation

on:
  push:
    branches:
      - ci/r4-label-economics-validation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
          enable-cache: false
      - run: uv sync --frozen
      - name: Focused R4 tests
        run: uv run pytest tests/test_label_economics.py -q
      - name: Full repository tests
        run: uv run pytest tests/ -q
