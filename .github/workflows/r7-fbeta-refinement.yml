name: Refine R7 priority objectives

on:
  push:
    branches:
      - automation/r7-fbeta-refinement

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/classification-operating-point-selection

      - name: Apply F-beta priority objectives
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}\n--- pattern ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "pdm/fault_prediction/metrics.py",
              '''import numpy as np\nimport pandas as pd\nfrom sklearn.metrics import (\n    average_precision_score,\n    f1_score,\n    precision_score,\n    recall_score,\n    roc_auc_score,\n)\n\n\nOPTIMIZATION_METRICS = {\n    "balanced": "f1",\n    "recall": "recall",\n    "precision": "precision",\n}\n''',
              '''import numpy as np\nimport pandas as pd\nfrom autogluon.core.metrics import make_scorer\nfrom sklearn.metrics import (\n    average_precision_score,\n    f1_score,\n    fbeta_score,\n    precision_score,\n    recall_score,\n    roc_auc_score,\n)\n\n\ndef _f2_score(y_true, y_pred) -> float:\n    """F2: emphasize recall while still penalizing false alarms."""\n    return float(fbeta_score(y_true, y_pred, beta=2.0, zero_division=0))\n\n\ndef _f05_score(y_true, y_pred) -> float:\n    """F0.5: emphasize precision while still rewarding failure coverage."""\n    return float(fbeta_score(y_true, y_pred, beta=0.5, zero_division=0))\n\n\nF2_SCORER = make_scorer(\n    name="f2",\n    score_func=_f2_score,\n    optimum=1.0,\n    greater_is_better=True,\n    needs_class=True,\n)\nF05_SCORER = make_scorer(\n    name="f0.5",\n    score_func=_f05_score,\n    optimum=1.0,\n    greater_is_better=True,\n    needs_class=True,\n)\n\nOPTIMIZATION_METRICS = {\n    "balanced": "f1",\n    "recall": F2_SCORER,\n    "precision": F05_SCORER,\n}\nOPTIMIZATION_METRIC_NAMES = {\n    "balanced": "f1",\n    "recall": "f2",\n    "precision": "f0.5",\n}\n''',
          )
          replace_once(
              "pdm/fault_prediction/metrics.py",
              '''def classification_eval_metric(priority: str = "balanced") -> str:\n    """Return the AutoGluon metric that matches the operating priority."""\n    return OPTIMIZATION_METRICS[normalize_optimization_priority(priority)]\n\n\ndef predictor_decision_threshold(predictor) -> float:\n''',
              '''def classification_eval_metric(priority: str = "balanced"):\n    """Return the AutoGluon scorer that matches the operating priority.\n\n    Recall and precision priorities use F2 and F0.5 rather than pure recall or\n    precision. This preserves the requested bias without selecting degenerate\n    all-positive or almost-all-negative operating points.\n    """\n    return OPTIMIZATION_METRICS[normalize_optimization_priority(priority)]\n\n\ndef classification_eval_metric_name(priority: str = "balanced") -> str:\n    """Return the stable, JSON-safe name of the priority's evaluation metric."""\n    return OPTIMIZATION_METRIC_NAMES[normalize_optimization_priority(priority)]\n\n\ndef predictor_decision_threshold(predictor) -> float:\n''',
          )

          replace_once(
              "pdm/fault_prediction/model.py",
              '''    binarize_labels,\n    classification_eval_metric,\n    compute_binary_metrics,\n''',
              '''    binarize_labels,\n    classification_eval_metric,\n    classification_eval_metric_name,\n    compute_binary_metrics,\n''',
          )
          replace_once(
              "pdm/fault_prediction/model.py",
              '''        eval_metric = classification_eval_metric(optimization_priority)\n        legacy_optimize_threshold = kwargs.get("optimize_threshold") if "optimize_threshold" in kwargs else None\n''',
              '''        eval_metric = classification_eval_metric(optimization_priority)\n        eval_metric_name = classification_eval_metric_name(optimization_priority)\n        legacy_optimize_threshold = kwargs.get("optimize_threshold") if "optimize_threshold" in kwargs else None\n''',
          )
          replace_once(
              "pdm/fault_prediction/model.py",
              '''                "optimization_priority": optimization_priority,\n                "eval_metric": eval_metric,\n                "smote_applied": use_smote and train_df[label].mean() < 0.10,\n''',
              '''                "optimization_priority": optimization_priority,\n                "eval_metric": eval_metric_name,\n                "smote_applied": use_smote and train_df[label].mean() < 0.10,\n''',
          )
          replace_once(
              "pdm/fault_prediction/model.py",
              '''                "optimization_priority": optimization_priority,\n                "eval_metric": eval_metric,\n            },\n''',
              '''                "optimization_priority": optimization_priority,\n                "eval_metric": eval_metric_name,\n            },\n''',
          )

          replace_once(
              "pdm/fault_prediction/train.py",
              '''    classification_eval_metric,\n    evaluate_binary_classifier,\n''',
              '''    classification_eval_metric,\n    classification_eval_metric_name,\n    evaluate_binary_classifier,\n''',
          )
          replace_once(
              "pdm/fault_prediction/train.py",
              '''    eval_metric = classification_eval_metric(optimization_priority)\n    predictor = TabularPredictor(\n''',
              '''    eval_metric = classification_eval_metric(optimization_priority)\n    eval_metric_name = classification_eval_metric_name(optimization_priority)\n    predictor = TabularPredictor(\n''',
          )
          replace_once(
              "pdm/fault_prediction/train.py",
              '''        "optimization_priority": optimization_priority,\n        "eval_metric": eval_metric,\n        "decision_threshold": round(predictor_decision_threshold(predictor), 6),\n''',
              '''        "optimization_priority": optimization_priority,\n        "eval_metric": eval_metric_name,\n        "decision_threshold": round(predictor_decision_threshold(predictor), 6),\n''',
          )
          replace_once(
              "pdm/fault_prediction/train.py",
              '''        "optimization_priority": optimization_priority,\n        "eval_metric": classification_eval_metric(optimization_priority),\n        "labels": {},\n''',
              '''        "optimization_priority": optimization_priority,\n        "eval_metric": classification_eval_metric_name(optimization_priority),\n        "labels": {},\n''',
          )
          replace_once(
              "pdm/fault_prediction/train.py",
              '''    eval_metric = (\n        classification_eval_metric(optimization_priority)\n        if formulation == "classification"\n        else "root_mean_squared_error"\n    )\n\n    # Use NASA scoring as objective for RUL if available\n    if formulation == "regression" and nasa_ag_scorer is not None:\n        eval_metric = nasa_ag_scorer\n''',
              '''    eval_metric = (\n        classification_eval_metric(optimization_priority)\n        if formulation == "classification"\n        else "root_mean_squared_error"\n    )\n\n    # Use NASA scoring as objective for RUL if available\n    if formulation == "regression" and nasa_ag_scorer is not None:\n        eval_metric = nasa_ag_scorer\n    eval_metric_name = getattr(eval_metric, "name", eval_metric)\n''',
          )
          replace_once(
              "pdm/fault_prediction/train.py",
              '''    print(f"  Target: {target_col} | Metric: {eval_metric}")\n''',
              '''    print(f"  Target: {target_col} | Metric: {eval_metric_name}")\n''',
          )
          replace_once(
              "pdm/fault_prediction/train.py",
              '''    metrics = {\n        "formulation": formulation, "metric": eval_metric,\n        "test_score": float(perf[eval_metric]) if isinstance(perf, dict) else float(perf),\n        "best_model": predictor.model_best,\n    }\n''',
              '''    metrics = {\n        "formulation": formulation, "metric": eval_metric_name,\n        "test_score": float(perf[eval_metric_name]) if isinstance(perf, dict) else float(perf),\n        "best_model": predictor.model_best,\n    }\n''',
          )

          replace_once(
              "pdm/remote/train_remote.py",
              '''            classification_eval_metric,\n            evaluate_binary_classifier,\n''',
              '''            classification_eval_metric,\n            classification_eval_metric_name,\n            evaluate_binary_classifier,\n''',
          )
          replace_once(
              "pdm/remote/train_remote.py",
              '''        eval_metric = classification_eval_metric(optimization_priority)\n        predictor = TabularPredictor(\n''',
              '''        eval_metric = classification_eval_metric(optimization_priority)\n        eval_metric_name = classification_eval_metric_name(optimization_priority)\n        predictor = TabularPredictor(\n''',
          )
          replace_once(
              "pdm/remote/train_remote.py",
              '''            "optimization_priority": optimization_priority,\n            "eval_metric": eval_metric,\n            "decision_threshold": round(predictor_decision_threshold(predictor), 6),\n''',
              '''            "optimization_priority": optimization_priority,\n            "eval_metric": eval_metric_name,\n            "decision_threshold": round(predictor_decision_threshold(predictor), 6),\n''',
          )

          replace_once(
              "pdm/remote/train_multilabel.py",
              '''        classification_eval_metric,\n        evaluate_binary_classifier,\n''',
              '''        classification_eval_metric,\n        classification_eval_metric_name,\n        evaluate_binary_classifier,\n''',
          )
          replace_once(
              "pdm/remote/train_multilabel.py",
              '''    eval_metric = classification_eval_metric(optimization_priority)\n    metrics = {\n''',
              '''    eval_metric = classification_eval_metric(optimization_priority)\n    eval_metric_name = classification_eval_metric_name(optimization_priority)\n    metrics = {\n''',
          )
          replace_once(
              "pdm/remote/train_multilabel.py",
              '''        "optimization_priority": optimization_priority,\n        "eval_metric": eval_metric,\n        "labels": {},\n''',
              '''        "optimization_priority": optimization_priority,\n        "eval_metric": eval_metric_name,\n        "labels": {},\n''',
          )
          replace_once(
              "pdm/remote/train_multilabel.py",
              '''            "optimization_priority": optimization_priority,\n            "eval_metric": eval_metric,\n            "decision_threshold": round(predictor_decision_threshold(predictor), 6),\n''',
              '''            "optimization_priority": optimization_priority,\n            "eval_metric": eval_metric_name,\n            "decision_threshold": round(predictor_decision_threshold(predictor), 6),\n''',
          )

          replace_once(
              "tests/test_classification_operating_point.py",
              '''from pdm.fault_prediction.metrics import (\n    classification_eval_metric,\n    normalize_optimization_priority,\n)\n''',
              '''from pdm.fault_prediction.metrics import (\n    classification_eval_metric,\n    classification_eval_metric_name,\n    normalize_optimization_priority,\n)\n''',
          )
          replace_once(
              "tests/test_classification_operating_point.py",
              '''    def fit(self, train_data, time_limit=None, presets=None, calibrate_decision_threshold="auto"):\n        self.fit_calibration = calibrate_decision_threshold\n        self.decision_threshold = {"f1": 0.41, "recall": 0.23, "precision": 0.79}[self.kwargs["eval_metric"]]\n        return self\n''',
              '''    def fit(self, train_data, time_limit=None, presets=None, calibrate_decision_threshold="auto"):\n        self.fit_calibration = calibrate_decision_threshold\n        metric_name = getattr(self.kwargs["eval_metric"], "name", self.kwargs["eval_metric"])\n        self.decision_threshold = {"f1": 0.41, "f2": 0.23, "f0.5": 0.79}[metric_name]\n        return self\n''',
          )
          replace_once(
              "tests/test_classification_operating_point.py",
              '''        ("recall", "recall", "recall"),\n        ("precision", "precision", "precision"),\n''',
              '''        ("recall", "recall", "f2"),\n        ("precision", "precision", "f0.5"),\n''',
          )
          replace_once(
              "tests/test_classification_operating_point.py",
              '''def test_priority_mapping(priority, normalized, metric):\n    assert normalize_optimization_priority(priority) == normalized\n    assert classification_eval_metric(priority) == metric\n''',
              '''def test_priority_mapping(priority, normalized, metric):\n    assert normalize_optimization_priority(priority) == normalized\n    assert classification_eval_metric_name(priority) == metric\n    scorer = classification_eval_metric(priority)\n    assert getattr(scorer, "name", scorer) == metric\n''',
          )
          replace_once(
              "tests/test_classification_operating_point.py",
              '''    assert predictor.kwargs["eval_metric"] == "recall"\n    assert predictor.fit_calibration == "auto"\n''',
              '''    assert getattr(predictor.kwargs["eval_metric"], "name", predictor.kwargs["eval_metric"]) == "f2"\n    assert predictor.fit_calibration == "auto"\n''',
          )

          replace_once(
              "tests/test_remote_classification_metrics.py",
              '''    assert metrics["eval_metric"] == "recall"\n''',
              '''    assert metrics["eval_metric"] == "f2"\n''',
          )
          replace_once(
              "tests/test_remote_classification_metrics.py",
              '''    assert label_metrics["eval_metric"] == "precision"\n''',
              '''    assert label_metrics["eval_metric"] == "f0.5"\n''',
          )

          # Make the expected policy explicit in the regression test module.
          p = Path("tests/test_classification_operating_point.py")
          text = p.read_text()
          marker = '''def test_unknown_priority_is_rejected():\n    with pytest.raises(ValueError, match="Unknown optimization priority"):\n        classification_eval_metric("accuracy")\n\n\n'''
          addition = '''def test_priority_scorers_bias_without_degenerate_objectives():\n    y_true = [1, 1, 1, 1, 0, 0, 0, 0]\n    precision_heavy = [1, 1, 0, 0, 0, 0, 0, 0]\n    recall_heavy = [1, 1, 1, 1, 1, 1, 0, 0]\n    assert classification_eval_metric("recall")(y_true, recall_heavy) > classification_eval_metric("recall")(y_true, precision_heavy)\n    assert classification_eval_metric("precision")(y_true, precision_heavy) > classification_eval_metric("precision")(y_true, recall_heavy)\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit("test insertion marker mismatch")
          p.write_text(text.replace(marker, marker + addition, 1))
          PY

          git diff --check

      - name: Commit refinement
        run: |
          git config user.name "Youssef Faouzi"
          git config user.email "46967695+yousseffaouzi@users.noreply.github.com"
          git add pdm tests
          git commit -m "fix: use non-degenerate priority objectives"
          git push origin HEAD:feat/classification-operating-point-selection
