name: PDM01 final SageMaker serving contract validation
on:
  push:
    branches: [ci/pdm01-final-contract-validation]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - name: Locked dependencies including actual Flask serving extra
        run: uv sync --frozen --extra serve
      - name: Serving contract, HTTP error, and slim inference integration
        run: uv run --extra serve pytest tests/test_sagemaker_serving_contract.py tests/test_deployment.py tests/test_inference_container.py -q
      - name: Complete repository regression suite
        run: uv run --extra serve pytest tests/ -q
      - name: Verify syntax and documentation
        run: |
          uv run --extra serve python -m py_compile pdm/deployment/serving_io.py pdm/deployment/serve.py sagemaker_container/inference.py sagemaker_container/serve.py tests/test_sagemaker_serving_contract.py
          grep -q 'Endpoint Request/Response Contract' references/deployment.md
          grep -q 'FeatureSchemaError' sagemaker_container/serve.py
